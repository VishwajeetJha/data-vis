name: CI / CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install ruff mypy
          cd packages/backend
          ruff check .
          ruff format --check .

  test-backend:
    name: Pytest Backend Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd packages/backend
          pip install -e ".[dev]"
          pytest -v --cov=engine --cov=api --cov-report=xml

  build-desktop:
    name: Build Desktop Release (${{ matrix.platform }})
    needs: [lint-and-typecheck, test-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Frontend Dependencies
        run: pnpm install
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Python & Build Sidecar
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Python Sidecar Binary
        run: |
          cd packages/backend
          pip install pyinstaller -e .
          pyinstaller --noconfirm --clean sidecar.spec
      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'data-vis v__VERSION__'
          releaseBody: 'See release notes for details.'
          releaseDraft: false
          prerelease: false
